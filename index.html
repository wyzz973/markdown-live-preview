<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="本地优先的 Markdown 编辑器，实时预览、代码高亮、Mermaid 图表，断网也能用。">
    <meta name="color-scheme" content="light dark">
    <title>Markdown 预览</title>
    <link rel="icon" type="image/png" href="/favicon.png">

    <script>
      // Set the theme before first paint so the page never flashes light while
      // the module bundle loads. Mirrors the storage format in
      // src/modules/storage.js.
      (function () {
        try {
          var raw = localStorage.getItem('markdown-live-preview:theme');
          var stored = raw === null ? null : JSON.parse(raw);
          var dark =
            stored === 'dark' ||
            (stored !== 'light' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>

    <script type="module" src="/src/main.js"></script>
  </head>

  <body>
    <header class="bar">
      <button type="button" class="icon-btn" id="rail-toggle" aria-pressed="true">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <rect x="1.5" y="2.5" width="13" height="11" rx="1.5" stroke="currentColor"/>
          <path d="M6 2.5v11" stroke="currentColor"/>
        </svg>
        <span class="sr-only" data-i18n="toggleRail"></span>
      </button>

      <div class="path">
        <span class="brand" data-i18n="appName"></span>
        <span class="sep">/</span>
        <span class="doc-title" id="doc-title"></span>
        <span class="dot" id="save-dot"></span>
      </div>

      <div class="bar-right">
        <button type="button" class="search-btn" id="search-button">
          <svg width="13" height="13" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <circle cx="7" cy="7" r="4.5" stroke="currentColor"/>
            <path d="M10.5 10.5L14 14" stroke="currentColor" stroke-linecap="round"/>
          </svg>
          <span data-i18n="search"></span>
          <kbd id="search-shortcut">⌘K</kbd>
        </button>

        <div class="modes" role="group" id="modes">
          <button type="button" data-mode="edit" aria-pressed="false" data-i18n="modeEdit"></button>
          <button type="button" data-mode="split" aria-pressed="true" data-i18n="modeSplit"></button>
          <button type="button" data-mode="read" aria-pressed="false" data-i18n="modeRead"></button>
        </div>

        <label class="switch" for="sync-scroll-checkbox">
          <input type="checkbox" id="sync-scroll-checkbox">
          <span data-i18n="syncScroll"></span>
        </label>

        <div class="bar-actions">
          <button type="button" id="reset-button" data-i18n="reset"></button>
          <button type="button" id="copy-button"><span class="label" data-i18n="copy"></span></button>
          <button type="button" id="export-button" data-i18n="exportPdf"></button>
        </div>

        <button type="button" class="icon-btn" id="theme-button" aria-pressed="false">
          <svg class="icon-sun" width="15" height="15" viewBox="0 0 16 16" aria-hidden="true">
            <circle cx="8" cy="8" r="3.25" fill="currentColor"/>
            <g stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
              <path d="M8 1v1.6M8 13.4V15M15 8h-1.6M2.6 8H1M12.95 3.05l-1.13 1.13M4.18 11.82l-1.13 1.13M12.95 12.95l-1.13-1.13M4.18 4.18L3.05 3.05"/>
            </g>
          </svg>
          <svg class="icon-moon" width="15" height="15" viewBox="0 0 16 16" aria-hidden="true">
            <path fill="currentColor" d="M13.5 9.9A6 6 0 0 1 6.1 2.5a6 6 0 1 0 7.4 7.4z"/>
          </svg>
          <span class="sr-only" data-i18n="toggleTheme"></span>
        </button>
      </div>
    </header>

    <div class="mobile-tabs" role="tablist">
      <button type="button" class="mobile-tab" data-view="edit" role="tab"
              aria-selected="true" data-i18n="modeEdit"></button>
      <button type="button" class="mobile-tab" data-view="preview" role="tab"
              aria-selected="false" data-i18n="modeRead"></button>
    </div>

    <main id="container" data-mode="split" data-rail="open" data-mobile-view="edit">
      <nav class="rail" id="rail" data-folder="closed">
        <div class="rail-head">
          <button type="button" class="folder-btn" id="folder-button"
                  aria-haspopup="menu" aria-expanded="false">
            <span class="folder-name" id="folder-name"></span>
            <svg class="chev" width="9" height="9" viewBox="0 0 10 10" aria-hidden="true">
              <path d="M2 4l3 3 3-3" stroke="currentColor" stroke-width="1.4"
                    fill="none" stroke-linecap="round"/>
            </svg>
          </button>
          <span class="rail-count" id="heading-count"></span>

          <div class="folder-menu" id="folder-menu" role="menu" hidden>
            <span class="menu-label" data-i18n="recentFolders"></span>
            <div id="recent-folders"></div>
            <div class="menu-rule"></div>
            <button type="button" class="menu-item" id="pick-folder" role="menuitem"
                    data-i18n="openFolder"></button>
            <button type="button" class="menu-item" id="close-folder" role="menuitem"
                    data-i18n="closeFolder"></button>
          </div>
        </div>

        <div class="outline" id="outline"></div>

        <div class="rail-empty" id="rail-empty" hidden>
          <h2 data-i18n="emptyFolderTitle"></h2>
          <p data-i18n="emptyFolderBody"></p>
          <button type="button" class="open-btn" id="empty-open" data-i18n="openFolder"></button>
          <p class="caveat" data-i18n="emptyFolderCaveat"></p>
        </div>
      </nav>

      <section id="edit" class="pane">
        <div class="toolbar" id="toolbar" role="toolbar"></div>
        <div id="editor"></div>
      </section>

      <div id="split-divider" role="separator" aria-orientation="vertical" tabindex="0"></div>

      <section id="preview" class="pane">
        <div id="preview-wrapper">
          <article id="output" class="markdown-body"></article>
        </div>
      </section>

      <div class="scrim" id="scrim">
        <div class="palette" role="dialog" aria-modal="true">
          <input type="text" id="search-input" autocomplete="off" spellcheck="false">
          <div class="results" id="search-results"></div>
        </div>
      </div>
    </main>

    <div class="toast" id="toast" role="status" hidden></div>
  </body>
</html>
